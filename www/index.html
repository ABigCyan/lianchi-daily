<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>练吃日课</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell" id="app"><div class="loading">正在载入…</div></div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 15l2.5 2.5L16 13"/></svg>今天</button>
  <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9h3v6H2zM19 9h3v6h-3zM5 7h3v10H5zM16 7h3v10h-3zM8 12h8"/></svg>训练</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>统计</button>
  <button data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/></svg>计划</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>设置</button>
</div></nav>
<canvas id="confetti" hidden></canvas>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<script src="js/vendor/capacitor.js"></script>
<script src="js/vendor/local-notifications.js"></script>
<script src="js/data-rules.js"></script>
<script src="js/data-training.js"></script>
<script src="js/holidays.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
<script src="js/app2.js"></script>
</body>
</html>
